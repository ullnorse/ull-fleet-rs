[package]
name = "ull-fleet-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local fleet server and web UI for ull-esp-rs devices"

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
dotenvy = "0.15"
getrandom = "0.3"
futures-util = "0.3"
mime_guess = "2"
rust-embed = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ull-fleet-sign = { path = "../../tools/ull-fleet-sign" }
ull-fleet-types = { path = "../../common/ull-fleet-types" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
