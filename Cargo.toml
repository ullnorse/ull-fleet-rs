[workspace]
resolver = "2"
members = [
    "backend/ull-fleet-server",
    "common/ull-fleet-types",
    "frontend/ull-fleet-ui",
    "tools/ull-fleet-sign",
]
# The UI only builds for wasm32 (scripts/build-ui.sh).
default-members = [
    "backend/ull-fleet-server",
    "common/ull-fleet-types",
    "tools/ull-fleet-sign",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ullnorse/ull-fleet-rs"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
