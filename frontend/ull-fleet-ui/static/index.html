<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleet">
<title>Fleet</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="{{css}}">
<link rel="modulepreload" href="{{js}}">
<link rel="preload" href="{{wasm}}" as="fetch" type="application/wasm" crossorigin>
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true"><div class="boot-mark"></div></div>
<script type="module">
  import init from "{{js}}";
  init({ module_or_path: "{{wasm}}" }).catch((err) => {
    document.getElementById("boot").textContent = "The app failed to load: " + err;
  });
</script>
</body>
</html>
